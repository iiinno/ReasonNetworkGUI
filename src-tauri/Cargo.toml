[package]
name = "reason-network-gui"
version = "0.1.0"
description = "A local observability desk for Reason Network"
authors = ["Reason Network GUI"]
edition = "2021"

[lib]
name = "reason_network_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
