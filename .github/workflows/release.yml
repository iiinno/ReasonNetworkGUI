name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Build Tauri app (installer)
        run: npm run tauri build
      - name: Publish installer to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          mapfile -t assets < <(find src-tauri/target/release/bundle -type f -name '*.exe')
          [[ ${#assets[@]} -ge 1 ]] || { echo 'No installer found'; exit 1; }
          printf 'Assets: %s\n' "${assets[@]}"
          gh release create "$tag" "${assets[@]}" --verify-tag --generate-notes --title "$tag"
